[INCLUDES]
before = common.conf

[Definition]
# ============================================================
# Caddy Docker JSON 日志过滤规则
# 注意：failregex 多行续写时，后续行必须以空格/Tab开头
# 且续写块内部不能插入独立的注释行
# ============================================================

# 规则1: 基础认证失败(basic auth) | 规则2: 敏感路径扫描(403/404) | 规则3: 恶意请求(路径遍历/SQLi/XSS)
failregex = "log":".*\"logger\":\"http.log.error\".*\"msg\":\"basic auth: invalid credentials\".*\"remote_addr\":\"(?:<HOST>|\[(<HOST>)\]):\d+\""
            "log":".*\"uri\":\"/(admin|wp-admin|config|database|api/v1/auth|phpmyadmin)\".*\"status\":(403|404).*\"remote_addr\":\"(?:<HOST>|\[(<HOST>)\]):\d+\""
            "log":".*\"uri\":\".*(\.\./|UNION SELECT|<script>).*\".*\"remote_addr\":\"(?:<HOST>|\[(<HOST>)\]):\d+\""

# [已禁用] 通用高频扫描(403/404)，建议仅在 maxretry 较高时单独启用
# failregex = "log":".*\"status\":(403|404).*\"remote_addr\":\"(?:<HOST>|\[(<HOST>)\]):\d+\""

ignoreregex =